<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title %}{% assign page_title = page.title | append: " | " | append: site.title %}{% else %}{% assign page_title = site.title %}{% endif %}
  <title>{{ page_title }}</title>
  {% if page.summary %}{% assign page_desc = page.summary %}{% else %}{% assign page_desc = site.description %}{% endif %}
  <meta name="description" content="{{ page_desc | strip_html | xml_escape }}">
  <meta property="og:title" content="{{ page_title | xml_escape }}">
  <meta property="og:description" content="{{ page_desc | strip_html | xml_escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta name="theme-color" content="#012456">
  <link rel="preload" href="{{ '/assets/fonts/be-vietnam-pro-vietnamese-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23012456'/%3E%3Ctext x='5' y='22' font-family='monospace' font-size='16' fill='%23EEEDF0'%3E%3E_%3C/text%3E%3C/svg%3E">
</head>
